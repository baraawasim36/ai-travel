<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="google-maps-api-key" content="GOOGLE_MAPS_API_KEY_PLACEHOLDER">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tour_guide_application">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>tour_guide_application</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JS API - key injected at build time -->
  <script id="google-maps-api">
    (function() {
      var key = document.querySelector('meta[name="google-maps-api-key"]').content;
      if (key && key !== 'GOOGLE_MAPS_API_KEY_PLACEHOLDER') {
        var script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?key=' + key;
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
      }
    })();
  </script>

</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
